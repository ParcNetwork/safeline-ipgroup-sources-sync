enabled: true
kind: playwright-json
group_base: amzn-searchbot
change_detector: auto
urls:
  - https://developer.amazon.com/amazonbot/searchbot-ip-addresses/
playwright-json:
  page_locator: "pre > code.hljs.json"
  timestamp_field: creationTime
  cidr_fields:
    - ip_prefix
rules:
  policy: allow
  enabled: true
upload:
  max_per_group: 10000
  initial_batch_size: 10000
  append_batch_size: 500
  sleep_between_batches: 0.4
  cleanup: delete
  placeholder_ip: 192.0.2.1